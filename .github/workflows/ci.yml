name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
      # The tests start this image; its binary is also the clickhouse-client the end-to-end tests drive.
      - name: clickhouse-client
        run: |
          docker pull clickhouse/clickhouse-server:26.6
          id=$(docker create clickhouse/clickhouse-server:26.6)
          mkdir -p "$RUNNER_TEMP/bin"
          docker cp "$id:/usr/bin/clickhouse" "$RUNNER_TEMP/bin/clickhouse"
          docker rm "$id"
          ln -s clickhouse "$RUNNER_TEMP/bin/clickhouse-client"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: go test -race -count=1 ./...

  image:
    name: Image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: chauth:ci
          cache-from: type=gha
      - name: lint the examples with the image
        run: docker run --rm -v "$PWD/examples:/examples:ro" chauth:ci lint --config /examples/config.yaml /examples/rbac
